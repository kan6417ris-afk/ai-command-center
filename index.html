<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020812">
  <meta name="robots" content="noindex,nofollow">
  <title>PROJECT ARC | SECURE GATEWAY</title>
  <style>
    :root {
      --bg: #020812;
      --panel: rgba(4, 24, 39, 0.86);
      --blue: #32c8ff;
      --text: #eaf8ff;
      --muted: #7aaac0;
      --green: #51f7bd;
      --border: rgba(50, 200, 255, 0.42);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 20%, #0c4e75 0%, #061c2c 28%, #020812 70%),
        #020812;
    }
    .panel {
      width: min(620px, 100%);
      padding: 42px 28px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 0 50px rgba(0,153,255,.14), inset 0 0 50px rgba(0,153,255,.05);
      backdrop-filter: blur(12px);
    }
    .core {
      width: 104px;
      height: 104px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d6f8ff, #38cfff 13%, #0784d8 40%, #002341 74%);
      box-shadow: 0 0 25px #0caeff, 0 0 80px rgba(0,174,255,.5);
      position: relative;
      animation: pulse 2.2s ease-in-out infinite;
    }
    .core::after {
      content: "";
      position: absolute;
      inset: 24%;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 50%;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .eyebrow {
      color: var(--blue);
      letter-spacing: .2em;
      font-size: 11px;
      margin-bottom: 10px;
    }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); letter-spacing: .08em; }
    p { margin: 18px auto 0; color: #a7cfdf; line-height: 1.8; max-width: 460px; }
    .status { margin-top: 26px; color: #a9d7cf; font-size: 13px; }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
    }
    a.button {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      background: rgba(35,162,229,.12);
    }
    .small { margin-top: 14px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="panel">
    <div class="core" aria-hidden="true"></div>
    <div class="eyebrow">PROJECT ARC · SECURE GATEWAY</div>
    <h1>AI司令部</h1>
    <p>Google認証で保護されたARC SYSTEMへ接続しています。</p>
    <div class="status"><span class="dot"></span>SECURE CONNECTION</div>
    <a class="button" id="enter" href="https://script.google.com/macros/s/AKfycbzQKIlQp01UoIi3oglrDv01jdOCFyZ79k92wWIR4KRggmTlaQ8rZiisUHoPYFUTsgwq4w/exec">ARC SYSTEMを開く</a>
    <div class="small">自動で移動しない場合は上のボタンを押してください。</div>
  </main>
  <script>
    const ARC_SECURE_URL = document.getElementById("enter").href;
    window.setTimeout(() => {
      window.location.replace(ARC_SECURE_URL);
    }, 700);
  </script>
</body>
</html>

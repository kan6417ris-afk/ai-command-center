<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI司令部</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eaf8ff;
      background:
        radial-gradient(circle at 50% 10%, #063a5c 0%, #021725 35%, #000812 75%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .command-center {
      width: min(100%, 900px);
      text-align: center;
    }

    .logo {
      font-size: 14px;
      letter-spacing: 4px;
      color: #55cfff;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      text-shadow: 0 0 25px #009dff;
    }

    .subtitle {
      color: #8ddfff;
      margin: 12px 0 40px;
    }

    .status {
      border: 1px solid #168fd1;
      background: rgba(0, 32, 54, 0.65);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 25px;
      box-shadow: 0 0 25px rgba(0, 157, 255, 0.15);
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #55f7c5;
      border-radius: 50%;
      box-shadow: 0 0 12px #55f7c5;
      margin-right: 8px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      display: block;
      padding: 28px 18px;
      color: white;
      text-decoration: none;
      border: 1px solid #168fd1;
      border-radius: 18px;
      background: linear-gradient(
        145deg,
        rgba(4, 45, 73, 0.9),
        rgba(1, 17, 30, 0.95)
      );
      transition: 0.2s;
      box-shadow: inset 0 0 20px rgba(0, 157, 255, 0.05);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #66d9ff;
      box-shadow: 0 0 25px rgba(0, 157, 255, 0.35);
    }

    .icon {
      font-size: 34px;
      display: block;
      margin-bottom: 10px;
    }

    .card strong {
      font-size: 20px;
    }

    .card small {
      display: block;
      color: #8ddfff;
      margin-top: 8px;
    }

    footer {
      margin-top: 40px;
      color: #5189a5;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="command-center">

    <div class="logo">PERSONAL AI COMMAND CENTER</div>

    <h1>AI司令部</h1>

    <p class="subtitle">
      家族の今を、より良い未来へ。
    </p>

    <div class="status">
      <span class="status-dot"></span>
      SYSTEM ONLINE — ベイマックス待機中
    </div>

    <div class="menu">

      <a class="card"
         href="https://docs.google.com/spreadsheets/d/1T7EmhOaq0zO5VCE5UoJAHYjg3LbC9vf74RZZKuGE8do/edit?gid=2129054345#gid=2129054345"
         target="_blank">
        <span class="icon">🤖</span>
        <strong>AI司令部</strong>
        <small>データ・未来を見える化</small>
      </a>

      <a class="card"
         href="https://kan6417ris-afk.github.io/-/"
         target="_blank">
        <span class="icon">🏠</span>
        <strong>家計管理部</strong>
        <small>今月の家計を管理</small>
      </a>

      <a class="card"
         href="https://docs.google.com/spreadsheets/d/1T7EmhOaq0zO5VCE5UoJAHYjg3LbC9vf74RZZKuGE8do/edit?gid=2129054345#gid=2129054345"
         target="_blank">
        <span class="icon">📈</span>
        <strong>資産管理室</strong>
        <small>資産形成・配当・FIRE</small>
      </a>

    </div>

    <footer>
      SMALL STEPS · BIG FUTURES
    </footer>

  </main>

</body>
</html>
